<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Puzzle IQ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="startup">

    <h1>🧩 Puzzle IQ</h1>

    <div class="controls"> <!--commandes du jeu (generer, etc)-->
        Largeur <input id="w" type="number" value="6" min="4" max="10">
        Hauteur <input id="h" type="number" value="6" min="4" max="10">
        <button id="reset-placed">Tout remettre</button>
        <button id="generate">Commencer</button>
    </div>

    <p class="hint">Choisis la taille puis clique sur Commencer</p>
    <!--conteneur du jeu (tableau + tableau de pieces)-->

    <div class="game">
        <svg id="board"></svg> <!--grille du tableau-->
        <svg id="pieces"></svg> <!--place pour les pieces-->
    </div>

    <script src="script.js"></script>
</body>

</html>
