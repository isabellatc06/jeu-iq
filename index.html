<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Puzzle IQ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🧩 Puzzle IQ</h1>

    <div class="controls">
        Largeur <input id="w" type="number" value="6" min="4" max="10">
        Hauteur <input id="h" type="number" value="6" min="4" max="10">
        <button id="generate">Générer</button>
    </div>

    <p class="hint">Choisis la taille puis clique sur Générer</p>

    <div class="game">
        <svg id="board"></svg>
        <svg id="pieces"></svg>
    </div>

    <script src="script.js"></script>
</body>

</html>
